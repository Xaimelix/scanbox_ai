name: Selectel offline tests

on:
  push:
    paths:
      - "scripts/**"
      - "docker/**"
      - "cloud_run/**"
      - "compose*.yaml"
      - ".github/workflows/selectel-tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "docker/**"
      - "cloud_run/**"
      - "compose*.yaml"
      - ".github/workflows/selectel-tests.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r scripts/requirements.txt -r cloud_run/requirements.txt
      - name: Selectel and Docker worker tests (no cloud credentials)
        run: python -m unittest discover -s scripts/tests -v
      - name: Cloud Run backend tests (no cloud credentials)
        run: python -m unittest discover -s cloud_run/tests -v
      - name: Validate Compose
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.gpu.yaml config --quiet
